name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          IMPULSE_KEYSTORE: ${{ runner.temp }}/release.jks
          IMPULSE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          IMPULSE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          IMPULSE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the files
        run: |
          mkdir out
          for f in app/build/outputs/apk/release/*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "out/Impulse-$abi.apk"
          done
          cd out
          sha256sum *.apk > SHA256SUMS
          version="${GITHUB_REF_NAME#v}"
          {
            echo "{"
            echo "  \"version\": \"$version\","
            echo "  \"tag\": \"$GITHUB_REF_NAME\","
            echo "  \"apks\": {"
            first=1
            for f in *.apk; do
              abi="${f#Impulse-}"; abi="${abi%.apk}"
              sum=$(sha256sum "$f" | cut -d' ' -f1)
              bytes=$(stat -c %s "$f")
              [ $first -eq 1 ] || echo ","
              first=0
              printf '    "%s": {"file": "%s", "bytes": %s, "sha256": "%s"}' "$abi" "$f" "$bytes" "$sum"
            done
            echo ""
            echo "  }"
            echo "}"
          } > latest.json

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/SHA256SUMS
            out/latest.json
          generate_release_notes: false
